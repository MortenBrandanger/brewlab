name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Vercel's own git integration needs a GitHub connection on the Vercel account,
# which this account does not have. Deploying from Actions sidesteps that, and
# has the advantage that nothing ships unless CI passed first.
jobs:
  deploy:
    name: Deploy to Vercel
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Without the token the Vercel CLI fails with "--token is missing a
      # value", which says nothing about what to do. Skip cleanly instead, so
      # pushes stay green until the secret exists.
      - name: Check for a deploy token
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "\`VERCEL_TOKEN\` is not set, so there is nothing to deploy with."
              echo
              echo "Create one at <https://vercel.com/account/tokens>, then run:"
              echo
              echo '```'
              echo 'gh secret set VERCEL_TOKEN --repo MortenBrandanger/brewlab'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # `vercel build` refuses to run without the project settings on disk.
      - name: Pull project settings
        if: steps.guard.outputs.has_token == 'true'
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        if: steps.guard.outputs.has_token == 'true'
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.guard.outputs.has_token == 'true'
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
